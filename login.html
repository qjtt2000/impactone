<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>登录｜IMPACTONE</title>
  <meta name="description" content="登录 IMPACTONE 会员账户。">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">
  <div class="wrap nav">

    <a class="logo" href="index.html">
      IMPACTONE
    </a>

    <nav class="desktop-nav">
      <a href="index.html">首页</a>
      <a href="daily.html">每日必读</a>
      <a href="index.html#insights">洞见</a>
      <a href="people.html">人物</a>
      <a href="index.html#video">视频</a>
      <a href="index.html#events">活动</a>
      <a href="index.html#about">关于</a>
    </nav>

    <div class="nav-actions">
      <a class="login-link active" href="login.html">
        登录
      </a>

      <a class="btn gold small" href="register.html">
        免费注册
      </a>

      <button
        class="menu-btn"
        id="menuBtn"
        aria-label="打开菜单"
      >
        ☰
      </button>
    </div>

  </div>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">首页</a>
    <a href="daily.html">每日必读</a>
    <a href="index.html#insights">洞见</a>
    <a href="people.html">人物</a>
    <a href="login.html">登录</a>
    <a href="register.html">免费注册</a>
  </div>
</header>


<main class="account-page">

  <div class="account-card">

    <div class="eyebrow">
      IMPACTONE MEMBER
    </div>

    <h1>
      登录
    </h1>

    <p class="account-intro">
      登录你的 IMPACTONE 账户，
      管理订阅与会员信息。
    </p>


    <form
      class="account-form"
      id="loginForm"
    >

      <label for="loginEmail">
        邮箱
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="your@email.com"
        required
      >


      <label for="loginPassword">
        密码
      </label>

      <input
        id="loginPassword"
        type="password"
        placeholder="请输入密码"
        required
      >


      <button
        class="btn gold account-button"
        type="submit"
      >
        登录
      </button>

    </form>


    <div
      class="account-message"
      id="loginMessage"
    ></div>


    <p class="account-switch">
      还没有账户？
      <a href="register.html">
        免费注册
      </a>
    </p>


    <p class="account-note">
      IMPACTONE 目前所有内容免费开放，
      无需注册也可以阅读。
    </p>

  </div>

</main>


<footer>

  <div class="wrap copyright">
    © 2026 IMPACTONE. All Rights Reserved.
  </div>

</footer>


<script src="script.js"></script>

</body>
</html>
