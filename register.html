<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>免费注册｜IMPACTONE</title>

  <meta
    name="description"
    content="免费加入 IMPACTONE，订阅影响力·每日必读并建立会员账户。"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">

  <div class="wrap nav">

    <a class="logo" href="index.html">
      IMPACTONE
    </a>

    <nav class="desktop-nav">
      <a href="index.html">首页</a>
      <a href="daily.html">每日必读</a>
      <a href="index.html#insights">洞见</a>
      <a href="people.html">人物</a>
      <a href="index.html#video">视频</a>
      <a href="index.html#events">活动</a>
      <a href="index.html#about">关于</a>
    </nav>

    <div class="nav-actions">

      <a
        class="login-link"
        href="login.html"
      >
        登录
      </a>

      <a
        class="btn gold small"
        href="register.html"
      >
        免费注册
      </a>

      <button
        class="menu-btn"
        id="menuBtn"
        aria-label="打开菜单"
      >
        ☰
      </button>

    </div>

  </div>


  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">首页</a>
    <a href="daily.html">每日必读</a>
    <a href="index.html#insights">洞见</a>
    <a href="people.html">人物</a>
    <a href="login.html">登录</a>
    <a href="register.html">免费注册</a>
  </div>

</header>


<main class="account-page">

  <div class="account-card">

    <div class="eyebrow">
      JOIN IMPACTONE
    </div>

    <h1>
      免费注册
    </h1>

    <p class="account-intro">
      加入 IMPACTONE，
      建立你的读者账户。
    </p>


    <form
      class="account-form"
      id="registerForm"
    >

      <label for="registerName">
        姓名
        <span>（可选）</span>
      </label>

      <input
        id="registerName"
        type="text"
        placeholder="你的姓名"
      >


      <label for="registerEmail">
        邮箱
      </label>

      <input
        id="registerEmail"
        type="email"
        placeholder="your@email.com"
        required
      >


      <label for="registerPassword">
        设置密码
      </label>

      <input
        id="registerPassword"
        type="password"
        minlength="8"
        placeholder="至少8位"
        required
      >


      <label class="checkbox-row">

        <input
          id="dailyOptIn"
          type="checkbox"
          checked
        >

        <span>
          同时订阅《影响力·每日必读》
        </span>

      </label>


      <button
        class="btn gold account-button"
        type="submit"
      >
        免费加入 IMPACTONE
      </button>

    </form>


    <div
      class="account-message"
      id="registerMessage"
    ></div>


    <p class="account-switch">
      已经有账户？
      <a href="login.html">
        登录
      </a>
    </p>


    <p class="account-note">
      目前 IMPACTONE 内容免费开放。
      未来推出付费会员后，
      免费会员账户仍然可以继续使用。
    </p>

  </div>

</main>


<footer>

  <div class="wrap copyright">
    © 2026 IMPACTONE. All Rights Reserved.
  </div>

</footer>


<script src="script.js"></script>

</body>
</html>
