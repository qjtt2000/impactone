name: Send WeChat Daily Brief Notification

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "daily/*.html"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new daily issue
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "date=" >> "$GITHUB_OUTPUT"
            echo "page_date=" >> "$GITHUB_OUTPUT"
            echo "Manual test requested."
            exit 0
          fi

          NEW_FILE=$(git diff --diff-filter=A --name-only HEAD^ HEAD | grep -E '^daily/[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$' | head -n 1 || true)

          if [ -n "$NEW_FILE" ]; then
            BASENAME=$(basename "$NEW_FILE" .html)
            MESSAGE_DATE=$(echo "$BASENAME" | tr '-' '/')

            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "file=$NEW_FILE" >> "$GITHUB_OUTPUT"
            echo "date=$MESSAGE_DATE" >> "$GITHUB_OUTPUT"
            echo "page_date=$BASENAME" >> "$GITHUB_OUTPUT"

            echo "New daily issue: $NEW_FILE"
            echo "Message date: $MESSAGE_DATE"
            echo "Page date: $BASENAME"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "No new official daily issue. Notification skipped."
          fi

      - name: Wait for Vercel production deployment
        if: >
          steps.check.outputs.send == 'true' &&
          github.event_name == 'push'
        run: sleep 60

      - name: Send WeChat notification
        if: steps.check.outputs.send == 'true'
        env:
          WECHAT_SEND_ADMIN_KEY: ${{ secrets.WECHAT_SEND_ADMIN_KEY }}
          MESSAGE_DATE: ${{ steps.check.outputs.date }}
          PAGE_DATE: ${{ steps.check.outputs.page_date }}
        shell: bash
        run: |
          if [ -n "$MESSAGE_DATE" ] && [ -n "$PAGE_DATE" ]; then

            PAGE="pages/webview/webview?date=$PAGE_DATE"

            BODY=$(jq -n \
              --arg key "$WECHAT_SEND_ADMIN_KEY" \
              --arg date "$MESSAGE_DATE" \
              --arg page "$PAGE" \
              '{
                adminKey: $key,
                content: "影响力·每日必读已更新",
                author: "IMPACTONE",
                source: "影响力·每日必读",
                date: $date,
                page: $page
              }')
          else
            BODY=$(jq -n \
              --arg key "$WECHAT_SEND_ADMIN_KEY" \
              '{
                adminKey: $key,
                content: "影响力·每日必读已更新",
                author: "IMPACTONE",
                source: "影响力·每日必读",
                page: "pages/webview/webview"
              }')
          fi

          echo "Sending notification..."
          echo "$BODY"

          RESPONSE=$(curl --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "https://impactone-gamma.vercel.app/api/wechat-send" \
            --header "Content-Type: application/json" \
            --data "$BODY")

          echo "$RESPONSE"
