name: Generate Daily MP3
on:
  push:
    branches: [main]
    paths:
      - daily/audio-request.txt
  workflow_dispatch:
    inputs:
      edition_date:
        description: Edition date (YYYY-MM-DD)
        required: true
        type: string
      edition_scope:
        description: Edition to publish
        default: both
        type: choice
        options: [both, global, ny, special]
concurrency:
  group: publish-daily-audio
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  audio:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDITION_DATE: ${{ inputs.edition_date }}
      EDITION_SCOPE: ${{ inputs.edition_scope }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve edition request
        run: |
          if [ -z "$EDITION_DATE" ]; then
            printf 'EDITION_DATE=%s\n' "$(sed -n '1p' daily/audio-request.txt)" >> "$GITHUB_ENV"
            EDITION_SCOPE="$(sed -n '2p' daily/audio-request.txt)"
          fi
          printf 'EDITION_SCOPE=%s\n' "${EDITION_SCOPE:-both}" >> "$GITHUB_ENV"
      - name: Validate settings and select editions
        run: |
          python -c 'import datetime, os; d=os.environ["EDITION_DATE"]; assert datetime.date.fromisoformat(d).isoformat() == d'
          test -n "$AZURE_SPEECH_KEY" || { echo 'Missing AZURE_SPEECH_KEY repository secret'; exit 1; }
          test -n "$AZURE_SPEECH_REGION" || { echo 'Missing AZURE_SPEECH_REGION repository variable'; exit 1; }
          case "$EDITION_SCOPE" in
            global) printf 'daily/%s.html\n' "$EDITION_DATE" > .daily-audio-targets ;;
            special) printf 'daily/%s.A.html\n' "$EDITION_DATE" > .daily-audio-targets ;;
            ny) printf 'daily/%s-ny.html\n' "$EDITION_DATE" > .daily-audio-targets ;;
            both) printf 'daily/%s.html\ndaily/%s-ny.html\n' "$EDITION_DATE" "$EDITION_DATE" > .daily-audio-targets ;;
            *) echo 'Invalid edition scope'; exit 1 ;;
          esac
          while IFS= read -r page; do test -f "$page"; done < .daily-audio-targets
      - name: Install audio dependencies
        run: |
          python -m pip install lxml
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate selected MP3s
        run: |
          while IFS= read -r page; do
            python scripts/synthesize-daily.py "$page"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name "daily/audio/$(basename "$page" .html).mp3" | grep -qx 'codec_name=mp3'
          done < .daily-audio-targets
      - uses: actions/upload-artifact@v4
        with:
          name: daily-audio-${{ env.EDITION_DATE }}-${{ env.EDITION_SCOPE }}
          path: daily/audio/${{ env.EDITION_DATE }}*.mp3
          if-no-files-found: error
      - name: Publish selected editions to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          while IFS= read -r page; do git diff --exit-code HEAD origin/main -- "$page"; done < .daily-audio-targets
          git merge --ff-only origin/main
          while IFS= read -r page; do
            python scripts/publish-daily-audio.py "$page"
            git add -- "$page" "daily/audio/$(basename "$page" .html).mp3"
          done < .daily-audio-targets
          if ! git diff --cached --quiet; then
            git commit -m "Publish $EDITION_SCOPE daily audio for $EDITION_DATE"
            git push origin HEAD:main
          fi
